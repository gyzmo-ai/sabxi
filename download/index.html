<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Download SABXI — ₹100 off on ₹200</title>
  <meta name="description" content="₹100 off your first SABXI order on ₹200. Cash on delivery. Mixes, cut fruit, raw veggies — Chembur, 5 km.">
  <link rel="canonical" href="https://sabxi.com/download">
  <meta name="theme-color" content="#FAF8F5">
  <link rel="icon" href="../assets/logo-trans.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --green: #1f9d45;
      --green-dark: #157a35;
      --orange: #ff7a1a;
      --ink: #10231a;
      --muted: #6b7b72;
      --line: #e7ece8;
      --cream: #faf8f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
    }
    .stage {
      height: 100dvh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 0;
      flex-shrink: 0;
    }
    .nav img { height: 36px; width: auto; }
    .ig {
      display: grid; place-items: center;
      width: 40px; height: 40px;
      border-radius: 12px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      text-decoration: none;
    }
    .main {
      flex: 1; min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 0 20px;
    }
    .copy { padding: 4px 22px 0; }
    .kicker {
      font-size: 11px; font-weight: 800;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 6px;
      animation: rise 0.7s ease both;
    }
    h1 { margin: 0; animation: rise 0.75s ease both; animation-delay: 0.06s; }
    .hero-off {
      font-size: clamp(56px, 16vw, 84px);
      line-height: 0.86; font-weight: 800;
      letter-spacing: -0.07em; color: var(--orange);
    }
    .hero-on {
      margin-top: 6px;
      font-size: clamp(22px, 6vw, 30px);
      line-height: 1.05; font-weight: 800; letter-spacing: -0.04em;
    }
    .hero-meta {
      margin-top: 10px; font-size: 14px; font-weight: 700;
      color: var(--green-dark);
      animation: rise 0.8s ease both; animation-delay: 0.14s;
    }
    .film { position: relative; margin: 12px 0; animation: rise 0.85s ease both; animation-delay: 0.22s; }
    .track {
      display: flex; gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding: 10px max(22px, calc(50vw - 108px));
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }
    .track::-webkit-scrollbar { display: none; }
    .card {
      flex: 0 0 min(54vw, 216px);
      scroll-snap-align: center;
      border: 0; padding: 0; background: transparent;
      cursor: pointer; text-align: left;
    }
    .shot {
      position: relative; aspect-ratio: 1;
      border-radius: 22px; overflow: hidden; background: #fff;
      transform: scale(0.9); opacity: 0.55;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
    }
    .card.on .shot { transform: scale(1); opacity: 1; }
    .shot img { width: 100%; height: 100%; object-fit: cover; }
    .card.on .shot img { animation: ken 7s ease-out forwards; }
    .caption { text-align: center; min-height: 40px; padding: 10px 22px 0; }
    .caption b { display: block; font-size: 15px; }
    .caption span { font-size: 12px; color: var(--muted); font-weight: 600; }
    .dock {
      padding: 0 22px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      animation: rise 0.9s ease both; animation-delay: 0.28s;
    }
    .cta {
      display: block; width: 100%; text-align: center;
      text-decoration: none; background: var(--ink); color: #faf8f5;
      font-weight: 800; font-size: 16px;
      padding: 16px 18px; border-radius: 18px;
      animation: glow 2.8s ease-in-out infinite;
    }
    .cta:active { transform: scale(0.98); }
    .links { display: flex; justify-content: center; gap: 18px; margin-top: 12px; }
    .link {
      border: 0; background: none; color: var(--muted);
      font: inherit; font-size: 13px; font-weight: 700;
      text-decoration: none; cursor: pointer; padding: 6px 0;
    }
    .other {
      display: block; text-align: center; margin-top: 6px;
      font-size: 12px; font-weight: 700; color: var(--muted); text-decoration: none;
    }
    .sheet {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(16, 35, 26, 0.48);
      display: none; align-items: flex-end;
    }
    .sheet.on { display: flex; animation: fade 0.22s ease; }
    .panel {
      width: 100%; max-height: min(78dvh, 560px);
      background: #fff; border-radius: 24px 24px 0 0; overflow: hidden;
      animation: sheet 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px 12px;
    }
    .panel-head h2 { font-size: 18px; letter-spacing: -0.03em; }
    .close {
      width: 36px; height: 36px; border: 0; border-radius: 999px;
      background: var(--cream); font-size: 20px; cursor: pointer;
    }
    #map { height: 280px; background: #f6f8f6; }
    .areas { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 20px; }
    .area {
      font-size: 12px; font-weight: 700; padding: 6px 10px;
      border-radius: 999px; background: #e7f6ec; color: var(--green-dark);
    }
    .toast {
      position: absolute; left: 50%; bottom: 8px;
      transform: translateX(-50%);
      background: var(--ink); color: #fff;
      font-size: 12px; font-weight: 700;
      padding: 8px 12px; border-radius: 999px;
      white-space: nowrap; pointer-events: none;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes ken { from { transform: scale(1); } to { transform: scale(1.08); } }
    @keyframes glow {
      0%, 100% { box-shadow: 0 10px 28px rgba(16, 35, 26, 0.18); }
      50% { box-shadow: 0 14px 36px rgba(16, 35, 26, 0.32); }
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sheet { from { transform: translateY(24px); } to { transform: translateY(0); } }
    @media (max-height: 700px) {
      .hero-off { font-size: 48px; }
      .hero-on { font-size: 20px; }
      .card { flex-basis: min(46vw, 168px); }
      .caption { min-height: 32px; padding-top: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .kicker, h1, .hero-meta, .film, .dock, .cta, .card.on .shot img { animation: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <header class="nav">
      <img src="../assets/logo-trans.png" alt="SABXI">
      <a class="ig" href="https://www.instagram.com/sabxi_studio/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden>
          <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
          <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>
        </svg>
      </a>
    </header>
    <div class="main">
      <div class="copy">
        <p class="kicker">First order · Chembur</p>
        <h1>
          <div class="hero-off">₹100 off</div>
          <div class="hero-on">on ₹200</div>
        </h1>
        <p class="hero-meta">Cash on delivery · FIRST100</p>
      </div>
      <div class="film">
        <div class="track" id="track"></div>
        <div class="caption">
          <b id="capName">Rajma Mix</b>
          <span id="capTag">Ready to cook · swipe for more</span>
        </div>
        <div class="toast" id="toast" hidden></div>
      </div>
      <div class="dock">
        <a class="cta" id="cta" href="https://play.google.com/store/apps/details?id=com.sabxi.sabxi">Download the SABXI app</a>
        <a class="other" id="other" href="https://apps.apple.com/in/app/sabxi/id6783602290">Prefer App Store?</a>
        <div class="links">
          <button class="link" type="button" id="openMap">5 km map</button>
          <a class="link" href="https://www.instagram.com/sabxi_studio/" target="_blank" rel="noopener noreferrer">Don’t trust us? Instagram</a>
        </div>
      </div>
    </div>
  </div>
  <div class="sheet" id="sheet">
    <div class="panel">
      <div class="panel-head">
        <h2>We deliver 5 km around Chembur</h2>
        <button class="close" type="button" id="closeMap" aria-label="Close">×</button>
      </div>
      <div id="map"></div>
      <div class="areas">
        <span class="area">Chembur</span>
        <span class="area">Tilak Nagar</span>
        <span class="area">Kurla</span>
        <span class="area">Ghatkopar</span>
        <span class="area">Govandi</span>
        <span class="area">Sion</span>
        <a class="link" href="https://www.google.com/maps/search/?api=1&query=SABXI+Chembur+Mumbai" target="_blank" rel="noopener noreferrer">Open in Google Maps</a>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      var PLAY = "https://play.google.com/store/apps/details?id=com.sabxi.sabxi";
      var APP = "https://apps.apple.com/in/app/sabxi/id6783602290";
      var PRODUCTS = [
        ["Rajma Mix", "Ready to cook", "products/rajma-mix.jpg"],
        ["Chole Mix", "Ready to cook", "products/chole-mix.jpg"],
        ["Hakka Noodle Mix", "Ready to cook", "products/hakka-noodle-mix.jpg"],
        ["Whole Cut Pineapple", "Cut fruit", "products/whole-cut-pineapple.jpg"],
        ["Cut Fruits Box", "Ready to eat", "products/cut-fruits-box.jpg"],
        ["Tomato", "Raw veg", "products/tomato.jpg"],
        ["Onion", "Raw veg", "products/onion.jpg"],
        ["Potato", "Raw veg", "products/potato.jpg"],
        ["Carrot", "Raw veg", "products/carrot.jpg"],
        ["Spinach", "Raw veg", "products/spinach.jpg"],
        ["Cauliflower", "Raw veg", "products/cauliflower.jpg"],
        ["Broccoli", "Raw veg", "products/broccoli.jpg"],
        ["Capsicum", "Raw veg", "products/capsicum.jpg"],
        ["Apple", "Raw fruit", "products/apple.jpg"],
        ["Mango", "Raw fruit", "products/mango.jpg"],
        ["Pomegranate", "Raw fruit", "products/pomegranate.jpg"],
        ["Watermelon", "Raw fruit", "products/watermelon.jpg"],
        ["Grapes", "Raw fruit", "products/grapes.jpg"],
        ["Orange", "Raw fruit", "products/orange.jpg"],
        ["Banana", "Raw fruit", "products/banana.jpg"],
        ["Papaya", "Raw fruit", "products/papaya.jpg"]
      ];
      var track = document.getElementById("track");
      var active = 0, paused = false, mapReady = false, toastTimer = 0;
      PRODUCTS.forEach(function (item, i) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "card" + (i === 0 ? " on" : "");
        b.setAttribute("data-card", "");
        b.setAttribute("data-index", String(i));
        b.innerHTML = '<div class="shot"><img src="' + item[2] + '" alt=""></div>';
        b.addEventListener("click", function () {
          goTo(i);
          toast(item[0] + " · in the app");
        });
        track.appendChild(b);
      });
      function goTo(i) {
        var card = track.querySelectorAll("[data-card]")[i];
        if (card) card.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
      }
      function setActive(i) {
        active = i;
        var cards = track.querySelectorAll("[data-card]");
        for (var n = 0; n < cards.length; n++) cards[n].classList.toggle("on", n === i);
        document.getElementById("capName").textContent = PRODUCTS[i][0];
        document.getElementById("capTag").textContent = PRODUCTS[i][1] + " · swipe for more";
      }
      function toast(text) {
        var el = document.getElementById("toast");
        el.hidden = false;
        el.textContent = text;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.hidden = true; }, 1800);
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting && e.intersectionRatio >= 0.6) {
            setActive(Number(e.target.getAttribute("data-index")));
          }
        });
      }, { root: track, threshold: 0.6 });
      track.querySelectorAll("[data-card]").forEach(function (c) { io.observe(c); });
      track.addEventListener("pointerdown", function () { paused = true; });
      track.addEventListener("pointerup", function () {
        setTimeout(function () { paused = false; }, 4000);
      });
      setInterval(function () {
        if (paused || document.getElementById("sheet").classList.contains("on")) return;
        if (active >= PRODUCTS.length - 1) return;
        goTo(active + 1);
      }, 2800);

      function device() {
        var ua = navigator.userAgent || "";
        if (/android/i.test(ua)) return "android";
        if (/iphone|ipad|ipod/i.test(ua)) return "ios";
        if (/macintosh/i.test(ua) && (navigator.maxTouchPoints || 0) > 1) return "ios";
        return "desktop";
      }
      var d = device();
      var playHref = PLAY, appHref = APP;
      function apply() {
        var href = d === "ios" ? appHref : playHref;
        var cta = document.getElementById("cta");
        cta.href = href;
        cta.textContent = d === "ios" ? "Download on the App Store" : d === "android" ? "Get it on Google Play" : "Download the SABXI app";
        var other = document.getElementById("other");
        other.href = d === "ios" ? playHref : appHref;
        other.textContent = d === "ios" ? "Prefer Google Play?" : "Prefer App Store?";
      }
      apply();
      fetch("https://api.sabxi.com/api/v1/public/download/config", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (p) {
          var data = p && p.data; if (!data) return;
          if (data.play_store_url) playHref = data.play_store_url;
          if (data.app_store_url) appHref = data.app_store_url;
          apply();
        }).catch(function () {});
      try {
        var raw = (location.search || "").replace(/^\?/, "").replace(/\?/g, "&");
        var params = new URLSearchParams(raw);
        var source = (params.get("utm_source") || params.get("source") || params.get("utm_campaign") || "").trim().slice(0, 64) || "sabxi_com";
        var sub = (params.get("utm_sub_source") || params.get("utm_content") || params.get("utm_medium") || params.get("utm_term") || "").trim().slice(0, 64) || null;
        fetch("https://api.sabxi.com/api/v1/public/download/events", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({
            device_type: d,
            destination: d === "ios" ? "app_store" : d === "android" ? "play_store" : "web",
            user_agent: (navigator.userAgent || "").slice(0, 512),
            source: source,
            sub_source: sub
          }),
          keepalive: true
        }).catch(function () {});
      } catch (e) {}

      var sheet = document.getElementById("sheet");
      document.getElementById("openMap").onclick = function () {
        sheet.classList.add("on");
        if (mapReady || !window.L) return;
        mapReady = true;
        var map = L.map("map", { scrollWheelZoom: false }).setView([19.055, 72.899], 13);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OSM", maxZoom: 18
        }).addTo(map);
        var circle = L.circle([19.055, 72.899], {
          radius: 5000, color: "#1F9D45", weight: 2, fillColor: "#1F9D45", fillOpacity: 0.18
        }).addTo(map);
        L.circleMarker([19.055, 72.899], {
          radius: 9, color: "#fff", weight: 3, fillColor: "#FF7A1A", fillOpacity: 1
        }).bindPopup("SABXI Chembur kitchen").addTo(map);
        map.fitBounds(circle.getBounds(), { padding: [24, 24], maxZoom: 13 });
        setTimeout(function () { map.invalidateSize(); }, 200);
      };
      document.getElementById("closeMap").onclick = function () { sheet.classList.remove("on"); };
      sheet.addEventListener("click", function (e) {
        if (e.target === sheet) sheet.classList.remove("on");
      });
    })();
  </script>
</body>
</html>
